name: Publish Pepper Image
run-name: Publish Pepper image from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - profiles/pepper/sandbox/**
      - .github/workflows/publish-pepper-image.yml
  workflow_dispatch:

concurrency:
  group: publish-pepper-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/petri-hub/pepper-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build
        run: TAG="${GITHUB_SHA::7}" docker compose build
        working-directory: profiles/pepper/sandbox

      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: TAG="${GITHUB_SHA::7}" docker compose push
        working-directory: profiles/pepper/sandbox

      - name: Summarize
        run: echo "Published \`$IMAGE:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
