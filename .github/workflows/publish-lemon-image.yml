name: Publish Lemon Image
run-name: Publish Lemon image from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - profiles/lemon/sandbox/**
      - profiles/lemon/skills/assets-answering/scripts/**
      - .github/workflows/publish-lemon-image.yml
  workflow_dispatch:

concurrency:
  group: publish-lemon-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/petri-hub/lemon-sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build
        run: docker build --pull --file profiles/lemon/sandbox/Dockerfile --tag "$IMAGE:${GITHUB_SHA::7}" --tag "$IMAGE:latest" profiles/lemon

      - name: Check headless Blender export and rendering
        run: |
          docker run --rm --user lemon --entrypoint blender "$IMAGE:${GITHUB_SHA::7}" \
            --background --python-exit-code 1 --python-expr \
            'import bpy, numpy, os; bpy.ops.export_scene.fbx(filepath="/tmp/check.fbx"); s = bpy.context.scene; s.render.engine = "CYCLES"; s.cycles.use_denoising = False; s.cycles.samples = 1; s.render.resolution_x = 64; s.render.resolution_y = 64; s.render.resolution_percentage = 100; s.render.filepath = "/tmp/check.png"; bpy.ops.render.render(write_still=True); assert os.path.getsize("/tmp/check.fbx") > 0 and os.path.getsize("/tmp/check.png") > 0'

      - name: Log in to GHCR
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"

      - name: Summarize
        run: echo "Published \`$IMAGE:${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
